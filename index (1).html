<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work2taskBot Mini App</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- MONETAG SDK INSTALLATION -->
    <script src="//libtl.com/sdk.js" data-zone="11682895" data-sdk="show_11682895"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { color: #ff9800; font-size: 22px; }
        .balance-box {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #333;
        }
        .balance { font-size: 28px; color: #4caf50; font-weight: bold; }
        button {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            transition: 0.3s;
        }
        button:active { transform: scale(0.98); }
        .footer-text { font-size: 12px; color: #777; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Barka da Zuwa, @<span id="username">Mai Amfani</span>!</h2>
        
        <div class="balance-box">
            <p style="margin: 0 0 5px 0; color: #aaa;">Adadin Maki (Points):</p>
            <div class="balance"><span id="points">0</span> PTS</div>
        </div>

        <!-- Wuraren Danna Talla -->
        <button id="btn-interstitial">Kalli Rewarded Interstitial (+10) 👑</button>
        <button id="btn-popup">Kalli Rewarded Popup (+5) 🎁</button>
        
        <p class="footer-text">Work2taskBot • Talla ta atomatik tana tashi ta In-App format.</p>
    </div>

    <!-- Haɗa da fayil na Javascript -->
    <script src="script.js"></script>
</body>
</html>
